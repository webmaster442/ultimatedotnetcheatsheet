	[Span&lt;T&gt;|
	Provides a type-safe and memory-safe
	representation of a contiguous region
	of arbitrary memory.|
	Span(ref T reference)
	Span(T\[\]? array)
	Span(void* pointer, int length)
	Span(T\[\]? array, int start, int length)|
	static Span&lt;T&gt; Empty { get }
	bool IsEmpty { get }
	ref T this\[int index\] { get }
	int Length { get }|
	void Clear()
	void CopyTo(Span&lt;T&gt; destination)
	void Fill(T value)
	Span&lt;T&gt;.Enumerator GetEnumerator()
	ref T GetPinnableReference()
	Span&lt;T&gt; Slice(int start)
	Span&lt;T&gt; Slice(int start, int length)
	T\[\] ToArray()
	bool TryCopyTo(Span&lt;T&gt; destination)|
	static bool operator ==(Span&lt;T&gt; left, Span&lt;T&gt; right)
	static bool operator !=(Span&lt;T&gt; left, Span&lt;T&gt; right)
	static implicit operator Span&lt;T&gt;(ArraySegment&lt;T&gt; segment)
	static implicit operator ReadOnlySpan&lt;T&gt;(Span&lt;T&gt; span)
	static implicit operator Span&lt;T&gt;(T\[\]? array);
	]
	
	[ReadOnlySpan&lt;T&gt;|
	Provides a type-safe and memory-safe 
	read-only representation of a contiguous
	region of arbitrary memory.|
	ReadOnlySpan(ref readonly T reference)
	ReadOnlySpan(T\[\]? array)
	ReadOnlySpan(void* pointer, int length)
	ReadOnlySpan(T\[\]? array, int start, int length)|
	static ReadOnlySpan&lt;T&gt; Empty { get }
	bool IsEmpty { get }
	ref readonly T this\[int index\] { get }
	int Length { get } |
	ReadOnlySpan&lt;T&gt; CastUp&lt;TDerived&gt;(ReadOnlySpan&lt;TDerived&gt; items)
	void CopyTo(Span&lt;T&gt; destination)
	ReadOnlySpan&lt;T&gt;.Enumerator GetEnumerator()
	ref readonly T GetPinnableReference()
	ReadOnlySpan&lt;T&gt; Slice(int start)
	ReadOnlySpan&lt;T&gt; Slice(int start, int length)
	T\[\] ToArray()
	bool TryCopyTo(Span&lt;T&gt; destination)|
	static bool operator ==(ReadOnlySpan&lt;T&gt; left, ReadOnlySpan&lt;T&gt; right)
	static bool operator !=(ReadOnlySpan&lt;T&gt; left, ReadOnlySpan&lt;T&gt; right);
	static implicit operator ReadOnlySpan&lt;T&gt;(ArraySegment&lt;T&gt; segment);
	static implicit operator ReadOnlySpan&lt;T&gt;(T\[\]? array);
	]</desc>
