	[ServiceProvider|
	The default IServiceProvider.]
	
	[IKeyedServiceProvider|
	Retrieves services
	using a key and a type.]
	
	[IAsyncDisposable|
	Provides a mechanism for 
	releasing unmanaged resources
	asynchronously.]
	
	[IDisposable|
	Provides a mechanism for 
	releasing unmanaged resources.]
	
	[IServiceProvider|
	Defines a mechanism for 
	retrieving a service object 
	that is, an object that provides
	custom support to other objects.]
	
	[IServiceProvider] &lt;:-- [IKeyedServiceProvider]
	[IKeyedServiceProvider] &lt;:-- [ServiceProvider]
	[IAsyncDisposable] &lt;:-- [ServiceProvider]
	[IDisposable] &lt;:-- [ServiceProvider]</desc>
