<svg version="1.1" baseProfile="full" width="835.0" height="283.8" viewBox="0 0 835 283.75" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:ev="http://www.w3.org/2001/xml-events">
	<title >linq-execution</title>
	<desc >#direction: right
	#spacing: 10
	#gravity: .8
	#arrowSize: 4
	#font: &apos;Open Sans&apos;
	#background: transparent
	#fill: #f4f6fb
	#title: linq-execution
	
	[Deferred|The operation isn&apos;t performed
	at the point in the code where the 
	query is declared]
	
	[Immediate|
	The data source is read
	and the operation is performed once]
	
	[Streaming|
	Operations that desn&apos;t have to read all 
	the source data before they yield element.]
	
	[Nonstreaming|
	Operations that must read all the source 
	data before they can yie
	ld a result element]
	
	[LINQ Execution] - [Immediate]
	[LINQ Execution] - [Deferred]
	[Deferred] - [Streaming]
	[Deferred] - [Nonstreaming]
		</desc>
